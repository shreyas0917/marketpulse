# promtool unit tests: latency (le=0.25) and freshness (le=2) SLIs, budget 0.01 each.
rule_files:
  - ../rules/slo-recording.yml
  - ../rules/slo-alerts.yml
evaluation_interval: 1m


tests:
  # LATENCY MUST FIRE: 1 in 6 quote requests is slower than 250 ms.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{route="/v1/quotes/{symbol}", le="0.25"}'
        values: '0+500x60'
      - series: 'http_request_duration_seconds_count{route="/v1/quotes/{symbol}"}'
        values: '0+600x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LatencyFastBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: latency, slo_target: "0.99", window: 1h/5m}
            exp_annotations: &lat1h
              summary: "Too many quote requests take longer than 250 ms (14.4x burn over 1h/5m)"
              description: "At this rate 2% of the 30-day latency error budget is used within 1h."
              runbook_url: https://github.com/shreyas0917/marketpulse/blob/main/docs/runbooks/latency-burn.md#fast-burn
          - exp_labels: {severity: page, slo: latency, slo_target: "0.99", window: 6h/30m}
            exp_annotations: &lat6h
              summary: "Too many quote requests take longer than 250 ms (6x burn over 6h/30m)"
              description: "At this rate 5% of the 30-day latency error budget is used within 6h."
              runbook_url: https://github.com/shreyas0917/marketpulse/blob/main/docs/runbooks/latency-burn.md#fast-burn

  # LATENCY MUST NOT FIRE: 99.5 % under 250 ms; slow health checks are not counted.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{route="/v1/quotes/{symbol}", le="0.25"}'
        values: '0+597x60'
      - series: 'http_request_duration_seconds_count{route="/v1/quotes/{symbol}"}'
        values: '0+600x60'
      - series: 'http_request_duration_seconds_bucket{route="/health/live", le="0.25"}'
        values: '0+0x60'
      - series: 'http_request_duration_seconds_count{route="/health/live"}'
        values: '0+600x60'
    promql_expr_test:
      - expr: round(sli:latency:error_ratio_rate5m, 0.000001)
        eval_time: 30m
        exp_samples:
          - labels: '{slo="latency", slo_target="0.99"}'
            value: 0.005
    alert_rule_test:
      - eval_time: 30m
        alertname: LatencyFastBurn
        exp_alerts: []

  # FRESHNESS MUST FIRE: degraded mode serving 20 % of quotes from a stale cache (age > 2 s).
  - interval: 1m
    input_series:
      - series: 'quote_age_seconds_bucket{le="2.0"}'
        values: '0+480x60'
      - series: 'quote_age_seconds_count'
        values: '0+600x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FreshnessFastBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: freshness, slo_target: "0.99", window: 1h/5m}
            exp_annotations: &fresh1h
              summary: "Too many served quotes are older than 2 s (14.4x burn over 1h/5m)"
              description: "At this rate 2% of the 30-day freshness error budget is used within 1h."
              runbook_url: https://github.com/shreyas0917/marketpulse/blob/main/docs/runbooks/freshness-burn.md#fast-burn
          - exp_labels: {severity: page, slo: freshness, slo_target: "0.99", window: 6h/30m}
            exp_annotations: &fresh6h
              summary: "Too many served quotes are older than 2 s (6x burn over 6h/30m)"
              description: "At this rate 5% of the 30-day freshness error budget is used within 6h."
              runbook_url: https://github.com/shreyas0917/marketpulse/blob/main/docs/runbooks/freshness-burn.md#fast-burn

  # FRESHNESS MUST NOT FIRE: every served quote is under 2 s old.
  - interval: 1m
    input_series:
      - series: 'quote_age_seconds_bucket{le="2.0"}'
        values: '0+600x60'
      - series: 'quote_age_seconds_count'
        values: '0+600x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FreshnessFastBurn
        exp_alerts: []
      - eval_time: 30m
        alertname: FreshnessSlowBurn
        exp_alerts: []
