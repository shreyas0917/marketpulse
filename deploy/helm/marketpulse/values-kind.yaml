# kind overrides. The image is built locally and loaded with `kind load docker-image`
# (no registry). Reach the API at http://127.0.0.1:18080 with Host: marketpulse.localtest.me.
image:
  repository: marketpulse
  tag: "0.1.0"
  pullPolicy: Never

ingress:
  host: marketpulse.localtest.me

api:
  # Pod-template environment for the API. Changing a value here and pushing to main is a release:
  # Argo CD syncs it and Argo Rollouts runs the canary. scripts/canary.sh edits this block.
  env:
    RELEASE_NOTE: "initial"
  rollout:
    enabled: true
