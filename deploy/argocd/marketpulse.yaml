# Argo CD Application: deploys the marketpulse chart from this repo's main branch onto kind.
# Pushing a values change to main is the release; Argo Rollouts runs the canary.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketpulse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shreyas0917/marketpulse.git
    targetRevision: main
    path: deploy/helm/marketpulse
    helm:
      releaseName: marketpulse
      valueFiles:
        - values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: marketpulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Apply and diff server-side so the diff ignores fields the API server defaults
      # (clusterIP, protocol, progressDeadlineSeconds, HPA scaleUp, PodMonitor action).
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
  # The HPAs own the API and worker replica counts; everything else must match Git.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: marketpulse-worker
      jsonPointers: ["/spec/replicas"]
    - group: argoproj.io
      kind: Rollout
      name: marketpulse-api
      jsonPointers: ["/spec/replicas"]
    # Argo Rollouts adds rollouts-pod-template-hash to the canary and stable Service selectors to
    # split traffic. Without this, the app goes OutOfSync after every canary and self-heal strips
    # the key, so the stable Service would also select canary pods (finding F15).
    - group: ""
      kind: Service
      name: marketpulse-api-canary
      jsonPointers: ["/spec/selector/rollouts-pod-template-hash"]
    - group: ""
      kind: Service
      name: marketpulse-api-stable
      jsonPointers: ["/spec/selector/rollouts-pod-template-hash"]
