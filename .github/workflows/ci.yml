name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.5/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Build image
        run: make image

      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id marketpulse:dev -u)" != "0"
