# Local MarketPulse stack: `make up` / `make down`.
# Host ports (override with MP_*_PORT): API 18000, worker 19100, producer 19200,
# Prometheus 19090, Alertmanager 19093, Grafana 13000.
# Fault-injection variables can be set from the shell, e.g.
#   FAULT_API_ERROR_RATE=0.2 docker compose up -d api

name: marketpulse

x-app: &app
  image: marketpulse:dev
  build: .
  read_only: true
  restart: unless-stopped
  environment: &app-env
    LOG_LEVEL: INFO
    REDIS_URL: redis://redis:6379/0
    SYMBOLS: RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN,BHARTIARTL,ITC,LT,KOTAKBANK,SMOKETEST
    PRODUCER_SYMBOLS: RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN,BHARTIARTL,ITC,LT,KOTAKBANK
    QUEUE_BACKEND: redis
    QUEUE_METRICS_INTERVAL_SECONDS: "5"
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      FAULT_API_ERROR_RATE: ${FAULT_API_ERROR_RATE:-0}
      FAULT_API_EXTRA_LATENCY_MS: ${FAULT_API_EXTRA_LATENCY_MS:-0}
      FAULT_READINESS_FAIL: ${FAULT_READINESS_FAIL:-false}
    ports: ["${MP_API_PORT:-18000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      FAULT_WORKER_FAIL_RATE: ${FAULT_WORKER_FAIL_RATE:-0}
      FAULT_WORKER_EXTRA_LATENCY_MS: ${FAULT_WORKER_EXTRA_LATENCY_MS:-0}
    ports: ["${MP_WORKER_PORT:-19100}:9100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    <<: *app
    command: ["producer"]
    environment:
      <<: *app-env
      PRODUCER_RATE: ${PRODUCER_RATE:-20}
    ports: ["${MP_PRODUCER_PORT:-19200}:9200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    ports: ["${MP_PROMETHEUS_PORT:-19090}:9090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["${MP_ALERTMANAGER_PORT:-19093}:9093"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${MP_GRAFANA_PORT:-13000}:3000"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
