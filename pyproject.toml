[project]
name = "marketpulse"
version = "0.1.0"
description = "Synthetic market-data service used as the subject of an SLO-driven reliability platform"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.118",
    "fastapi==0.162.0",
    "prometheus-client==0.26.0",
    "pydantic-settings==2.16.1",
    "redis==8.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[sqs]==1.43.118",
    "fakeredis[lua]==2.40.0",
    "httpx2==2.16.0",
    "moto[sqs]==5.2.4",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S311"]  # random is used for synthetic prices and fault sampling, not crypto

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["app"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 80
